  notes: >-
    Curated gene-disease records (3,851; all panels: DD, Eye, Skin, Skeletal,
    Cardiac, Cancer, Ear) with confidence, allelic requirement, variant
    consequence, HPO terms and curated PMIDs. Each row keeps its panels
    (column `panel`). Terms: https://www.ebi.ac.uk/gene2phenotype/responsible-handover
    (checked 2026-10-01; source EBI-G2P/gene2phenotype_web@6f9de16,
    src/views/ResponsibleHandoverView.vue): "The G2P dataset is released under
    the Creative Commons Attribution 4.0 (CC BY 4.0) licence." DDD caveat
    (ADR-0013 amendment 1): DDG2P (panel DD) was curated partly from the DDD
    study, a sealed eval cohort; any DDD no-regression result must disclose that
    G2P contributed. The column `additional mined publications` comes from G2P's
    ML literature pipeline, is not curator-reviewed, and is ignored by the parser.
    Phenotypes are per record, not per publication, so held-out PMID masking can
    only drop whole records.

