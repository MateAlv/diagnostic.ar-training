# Registry of every external input. Nothing enters a dataset, KB, model or
# evaluation unless it is listed here with an immutable URL and its sha256.
# `dxt sources fetch` materialises them into data/raw/<name>/<filename>,
# preferring a verified local copy and falling back to the URL.
#
# role — what the source may feed (enforced by lineage.registry.require_role):
#   knowledge  annotations/ontologies: may feed the simulator, KBs and training
#   cohort     patients; access only through a frozen split (data/splits/),
#              whose per-split purpose rules apply (see docs/EVAL_PROTOCOL.md)
#   eval       patients that may only ever be evaluated on, never trained or tuned on
#   baseline   a released model used as E0 / warm start
# sealed: true — patients readable only under a pre-registered experiment,
#   from a clean tree, with a row in docs/TEST_LEDGER.md (EVAL_PROTOCOL §2)
#
# See docs/DATA_LINEAGE.md for how to add a source.

