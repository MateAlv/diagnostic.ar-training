# R7: R6 plus sex and age/onset as inputs (simulated by sim4 when it provides them; real patients' own values).
label: R7
seed: 0
sim:
  preset: real_noise
  params: results/analyses/SIM4-v1/fit-folds-0-1-2.json
  real_ratio: 0.1
encoding:
  observed_flag: true
  ic_feature: true
  edges: both
  drop_dash: true
  covariates: true
arch:
  init: scratch
train:
  lr: 5.0e-4
  weight_decay: 5.0e-4
  batch_size: 128
  schedule: plateau
  plateau_factor: 0.5
  plateau_patience: 3
  warmup_steps: 500
  max_minutes: 60
  eval_every_steps: 5000
  num_workers: 12
